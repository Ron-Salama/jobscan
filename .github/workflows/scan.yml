name: Job Radar
on:
  schedule:
    # 17:00 target plus off-peak recovery checks. Only due scans fetch jobs.
    - cron: '0,17,37,53 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: jobscan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      ran: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether a scan is due
        id: check
        run: python cloud_run.py --check
      - if: steps.check.outputs.due == 'true'
        run: pip install -r requirements.txt
      - name: Regression checks
        if: steps.check.outputs.due == 'true'
        run: python -m unittest discover -s tests -v
      - name: Scan and notify new relevant giants
        if: steps.check.outputs.due == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_run.py
      - name: Save scan results and alert receipts
        if: always() && steps.check.outputs.due == 'true'
        run: |
          git config user.name 'jobscan-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/radar.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "scan $(date -u +%FT%TZ)"
            git push
          fi
      - name: Upload tracker
        if: steps.check.outputs.due == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: needs.scan.outputs.ran == 'true'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
