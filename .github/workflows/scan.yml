name: JobScan

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC). GitHub may delay under load.
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # allow committing data/ + docs/ back

concurrency:
  group: jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_run.py
      - name: Commit results
        run: |
          git config user.name "jobscan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "scan $(date -u +%FT%TZ)" || echo "no changes to commit"
          git push
