name: JobScan

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC). GitHub may delay under load.
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # allow committing data/ + docs/ back

concurrency:
  group: jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_run.py
      - name: Commit results
        run: |
          git config user.name "jobscan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "scan $(date -u +%FT%TZ)" || echo "no changes to commit"
          # Reconcile with anything pushed while this run was scanning. merge -X ours
          # keeps THIS scan's regenerated data/docs on any conflict, while still pulling
          # in non-conflicting changes (e.g. curation.json). Retry the push a few times
          # so an overlapping manual push can never make a scan fail to publish.
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            git merge -X ours --no-edit origin/main || true
            git push && break
            echo "push retry $i"; sleep 5
          done
      - name: Alert on run failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ JobScan run failed (run ${GITHUB_RUN_ID}) — scan did not publish. Check the Actions tab." || true
          fi
