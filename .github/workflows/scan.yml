name: JobScan

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC). GitHub may delay under load.
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # allow committing data/ + docs/ back

concurrency:
  group: jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_run.py
      - name: Commit results
        run: |
          git config user.name "jobscan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "scan $(date -u +%FT%TZ)" || echo "no changes to commit"
          # rebase onto any commit that landed while this run was scanning, so a
          # concurrent run / manual push can't make this scan's results fail to publish
          git pull --rebase --autostash origin main || true
          git push
      - name: Alert on run failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ JobScan run failed (run ${GITHUB_RUN_ID}) — scan did not publish. Check the Actions tab." || true
          fi
